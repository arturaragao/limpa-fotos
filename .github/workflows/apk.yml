name: APK Limpa Fotos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limpa-fotos-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Preparar wrapper
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon
          fi
          chmod +x gradlew
          ./gradlew --version
      - name: Preparar assinatura
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore.p12
          keytool -list -storetype PKCS12 -keystore keystore.p12 -storepass:env KEYSTORE_PASS -alias fotos > /dev/null
      - name: Verificar e gerar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: >-
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          -PversionCode="$VERSION_CODE" -PversionName="0.2.$VERSION_CODE"
      - name: Nomear APK
        run: cp app/build/outputs/apk/release/app-release.apk limpa-fotos.apk
      - name: Publicar latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Limpa Fotos 0.1.${{ github.run_number }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: limpa-fotos.apk
          fail_on_unmatched_files: true
          body: Limpa Fotos 0.1.${{ github.run_number }} — APK release assinado.
      - name: Remover keystore temporário
        if: always()
        run: rm -f -- keystore.p12
