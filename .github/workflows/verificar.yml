name: Verificar ramo

# Compila e testa ramos fora do main, sem assinar nem publicar release.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Preparar wrapper
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon
          fi
          chmod +x gradlew
      - name: Testes, lint e build debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: app/build/reports
